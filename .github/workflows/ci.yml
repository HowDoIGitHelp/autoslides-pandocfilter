name: CI Matrix

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.0', '9.2', '9.4', '9.6', '9.8', '9.10.3']
        cabal: ['3.10', '3.12', '3.14', '3.16.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Update Cabal index
        run: cabal update

      - name: Build & Test
        run: |
          cabal build all
