name: CI Matrix

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.0.2', '9.2.8', '9.4.8', '9.6.7', '9.8.4', '9.10.3']
        cabal: ['3.0.0.0', '3.2.0.0', '3.8.1.0', '3.10.3.0', '3.12.1.0', '3.14.2.0', '3.16.1.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Update Cabal index
        run: cabal update

      - name: Build & Test
        run: |
          cabal build all
